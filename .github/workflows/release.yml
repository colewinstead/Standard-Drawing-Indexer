name: Build and release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'catalog/**'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements-build.txt'
      - 'THIRD-PARTY-NOTICES.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build and test dependencies
        run: |
          npm ci
          python -m pip install -r requirements-build.txt
          npx playwright install --with-deps chromium
      - name: Build and verify catalog
        run: |
          npm run build
          git diff --exit-code -- catalog/drawings.json
      - name: Verify projects, offline app, and exported drawings
        run: |
          npm test
          npm run test:browser
          python scripts/verify-export.py
      - name: Prepare release files
        run: |
          mv 'dist/Standard Drawing Indexer.html' dist/Standard.Drawing.Indexer.html
          cd dist
          sha256sum Standard.Drawing.Indexer.html THIRD-PARTY-NOTICES.txt > SHA256SUMS.txt
      - name: Upload verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: .impeccable/review/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist
      - name: Verify downloaded release files
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish release for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}+build.${GITHUB_RUN_NUMBER}"
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          latest=false
          if [ "$main_sha" = "$GITHUB_SHA" ]; then latest=true; fi
          cat > release-notes.md <<'NOTES'
          Download **Standard Drawing Indexer.html** and open it in desktop Chrome or Edge. The single HTML includes the supplied 217-sheet MDOT library and works offline.

          Includes drawing search and preview, multipart selection, package reordering, combined PDF export, and project save/open using system file dialogs. Updates are not included.

          This build passed project tests, offline Chromium tests, and source-versus-export comparisons for all 217 drawing pages in CI. Browser file-dialog operations are stubbed in CI; this does not establish manual Windows dialog acceptance or agency applicability of the drawings.

          SHA256SUMS.txt contains checksums for the HTML and third-party notices. Keep this HTML snapshot with project records.
          NOTES
          printf '\nSource commit: `%s`\nBuild: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --draft=false --latest="$latest"
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "Standard Drawing Indexer ${version} · build ${GITHUB_RUN_NUMBER}" \
              --notes-file release-notes.md \
              --latest="$latest"
          fi
